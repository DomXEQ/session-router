name: XEQM sidecar build

# Reproducible static builds of the Session Router relay sidecar for XEQM, for both
# Linux architectures, packaged with the operator kit in contrib/xeqm and published
# with sha256 checksums. Runs on a sidecar-v* tag (attaches to that release) and on
# manual dispatch (artifacts only).

on:
  push:
    tags:
      - 'sidecar-v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (default: this ref)'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: static ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout (recursive)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates pkg-config \
            automake autoconf libtool patch python3 xz-utils ccache \
            libsodium-dev libssl-dev libunbound-dev

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.arch }}-

      - name: Pre-stage GMP from a reliable mirror
        run: |
          # gmplib.org frequently times out in CI and took the arm64 build down
          # twice on this tag. Stage GMP from the GNU mirror into a LOCAL_MIRROR
          # directory that the static-deps build checks before any remote mirror;
          # gmplib.org stays as the build's own last-resort fallback. The pinned
          # SHA512 matches cmake/session-deps/deps/libgmp.cmake and the build
          # re-verifies the tarball, so a bad mirror copy is rejected.
          set -u
          mkdir -p dep-mirror
          gmp=gmp-6.3.0.tar.xz
          want=e85a0dab5195889948a3462189f0e0598d331d3457612e2d3350799dba2e244316d256f8161df5219538eb003e4b5343f989aaa00f96321559063ed8c8f29fd2
          staged=
          for url in \
            "https://ftp.gnu.org/gnu/gmp/$gmp" \
            "https://mirrors.kernel.org/gnu/gmp/$gmp"; do
            echo "trying $url"
            if curl -fSL --retry 5 --retry-all-errors --retry-delay 3 \
                    --connect-timeout 30 --max-time 600 -o "dep-mirror/$gmp" "$url"; then
              got=$(sha512sum "dep-mirror/$gmp" | cut -d' ' -f1)
              if [ "$got" = "$want" ]; then echo "staged $gmp from $url"; staged=1; break; fi
              echo "hash mismatch from $url (got $got)"
            fi
          done
          if [ -z "$staged" ]; then
            echo "could not pre-stage GMP; build will fall back to gmplib.org"
            rm -f "dep-mirror/$gmp"
          fi

      - name: Configure (static deps)
        run: |
          cmake -G Ninja -B build \
            -DBUILD_STATIC_DEPS=ON \
            -DSROUTER_NATIVE_BUILD=OFF \
            -DWITH_SYSTEMD=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLOCAL_MIRROR="${{ github.workspace }}/dep-mirror"

      - name: Build
        run: ninja -C build session-router session-router-config

      - name: Verify portable (static) linkage
        run: contrib/ci/check-static-libs.sh build

      - name: Confirm XEQM build
        run: ./build/session-router --version

      - name: Package
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ver="${GITHUB_REF_NAME}"
          else
            ver="$(git describe --tags --always)"
          fi
          contrib/xeqm/make-package.sh "${{ matrix.arch }}" build "$ver" "$PWD/dist"
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: session-router-xeqm-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # First job to reach here creates the release; the other just uploads.
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "XEQM Session Router sidecar (non-enforcing). Verify downloads against the attached .sha256 files." \
            2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
